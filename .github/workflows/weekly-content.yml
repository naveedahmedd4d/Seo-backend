name: Weekly Content Cron

# Mondays 09:00 UTC — triggers Goal1 (≤7 social) + Goal2 (≤2 blogs) for enabled users.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run even if this ISO week already completed"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-due:
    name: Run due weekly content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Call weekly content cron endpoint
        env:
          WEEKLY_CRON_URL: ${{ secrets.WEEKLY_CRON_URL }}
          WEEKLY_CRON_SECRET: ${{ secrets.WEEKLY_CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${WEEKLY_CRON_URL:-}" ] || [ -z "${WEEKLY_CRON_SECRET:-}" ]; then
            echo "Missing WEEKLY_CRON_URL or WEEKLY_CRON_SECRET repo secrets."
            exit 1
          fi
          URL="${WEEKLY_CRON_URL%/}/api/weekly-content/cron/run-due?force=${FORCE}"
          echo "POST $URL"
          # Free Render may be cold — retry a few times.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/weekly-cron-body.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${WEEKLY_CRON_SECRET}" \
              -H "Accept: application/json" \
              --max-time 120 \
              "$URL" || true)
            echo "Attempt ${attempt}: HTTP ${code}"
            cat /tmp/weekly-cron-body.json || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "Weekly cron failed after retries"
          exit 1
