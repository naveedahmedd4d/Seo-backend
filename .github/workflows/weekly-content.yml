name: Weekly Content Cron

# Every 15 minutes. The API decides who is actually due from each user's saved
# run_frequency + cron_weekday + cron_time_utc, so the schedule lives in the
# database, not here. Ticks with nobody due return after one indexed query.
# GitHub can delay scheduled jobs by 10–40 minutes, so a 15-minute cadence keeps
# the chosen local time from being missed until the next hour.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run even if this ISO week already completed"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-due:
    name: Run due weekly content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Call weekly content cron endpoint
        env:
          WEEKLY_CRON_URL: ${{ secrets.WEEKLY_CRON_URL }}
          WEEKLY_CRON_SECRET: ${{ secrets.WEEKLY_CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${WEEKLY_CRON_URL:-}" ] || [ -z "${WEEKLY_CRON_SECRET:-}" ]; then
            echo "Missing WEEKLY_CRON_URL or WEEKLY_CRON_SECRET repo secrets."
            exit 1
          fi
          BASE="${WEEKLY_CRON_URL%/}"
          post_cron() {
            local path="$1"
            local timeout="$2"
            local url="${BASE}${path}?force=${FORCE}"
            echo "POST $url"
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/cron-body.json -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer ${WEEKLY_CRON_SECRET}" \
                -H "Accept: application/json" \
                --max-time "$timeout" \
                "$url" || true)
              echo "Attempt ${attempt}: HTTP ${code}"
              cat /tmp/cron-body.json || true
              echo
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep $((attempt * 15))
            done
            return 1
          }
          # Free Render may be cold — retry a few times.
          post_cron "/api/weekly-content/cron/run-due" 120 || {
            echo "Weekly cron failed after retries"
            exit 1
          }
          # One IT/AI blog for users who enabled daily news topics. Blog generation
          # is slower than the weekly tick, so this call gets a longer timeout.
          post_cron "/api/news-topics/cron/run-due" 900 || {
            echo "News topics cron failed after retries"
            exit 1
          }
